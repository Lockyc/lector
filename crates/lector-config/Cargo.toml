[package]
name = "lector-config"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "6"
# Shared house-style TOML formatter + colour parsing, shared with warden and curator. Pinned by rev —
# the shared formatter must format identically in all three apps, so an unpinned dep floating forward
# in only one repo would silently diverge `lector fmt` from its siblings. This rev MUST match
# curator's and warden's; bump all three in lockstep.
config-core = { git = "https://github.com/Lockyc/config-core", rev = "21dda544f20d5167182c0655637420bead42528c" }
# shell-core's zero-dep surface only (the `{window}:{within}` child-label scheme); same rev as
# src-tauri's two entries.
shell-core = { git = "https://github.com/Lockyc/shell-core", rev = "443eff6efcfcba52ec2dcb0e19cd037eefd1f67c", default-features = false }
