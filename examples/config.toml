dark_mode = true
density   = "compact"

[[window]]
  title  = "Docs"
  width  = 1400
  height = 900
  # The repo itself — compositor renders its README as the home page. A path relative to the
  # repo root, so this example validates warning-free from a clean checkout on any machine
  # (warden's examples/projects/ mock dirs are the same idea).
  [[window.tab]]
    title        = "lector"
    dir          = "."
    load_on_open = true
