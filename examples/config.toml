dark_mode = true
density   = "compact"

# What ⌘1/⌘2 do: "jump" (default — ⌘1–⌘9 jump to a tab position) or "cycle" (⌘1 next tab,
# ⌘2 previous, jumps shift to ⌘3–⌘9). Hot-reloads.
# tab_digit_keys = "cycle"

[[window]]
  title  = "Docs"
  width  = 1400
  height = 900
  # The repo itself — compositor renders its README as the home page. A path relative to the
  # repo root, so this example validates warning-free from a clean checkout on any machine
  # (warden's examples/projects/ mock dirs are the same idea).
  [[window.tab]]
    title        = "lector"
    dir          = "."
    load_on_open = true

    # A project-tree root: every git repo under `dir` (to `depth`) becomes a doc tab, rendered as a
    # collapsible folder tree with a ⟳ rescan button. Discovered tabs are always lazy (server starts
    # on select). `name` defaults to the dir's basename. Kept commented so this example still
    # validates on any machine without depending on `~/Developer` existing.
    # [[window.root]]
    # name = "Developer"
    # dir = "~/Developer"
    # depth = 4
