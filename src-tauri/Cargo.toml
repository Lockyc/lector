[package]
name = "lector"
version = "0.8.0"
edition = "2021"
publish = false

[lib]
name = "lector_lib"
path = "src/lib.rs"

[[bin]]
name = "lector"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The sidebar chrome: this crate is a thin include_str! wrapper, and build.rs writes the assets into
# frontendDist before generate_context! embeds that dir.
chrome-core = { git = "https://github.com/Lockyc/chrome-core", rev = "fbed5cea5ac65cb1166c96c0152e5b186433f779" }
# Zero-dep by default — build_stamp() + materialize_scripts() are all build.rs needs.
# `default-features = false` is LOAD-BEARING: without it this build-dep drags in the whole tauri tree.
shell-core = { git = "https://github.com/Lockyc/shell-core", rev = "d6affad4e56ec88c2b056aeb90ef2f7d8a61da74", default-features = false }

[dependencies]
lector-config = { path = "../crates/lector-config" }
# "unstable" is LOAD-BEARING: Window::add_child (the content-webview creation primitive
# webviews.rs uses to composite a tab's page above the sidebar chrome) is gated behind it.
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# The render engine. One serve loop per live tab; lector never renders anything itself.
compositor = { git = "https://github.com/Lockyc/compositor", rev = "63cf784afc31acf80242b1930d2b229ea095a597" }
# The Tauri runtime sliver: register_plugins (window geometry, updater, process).
shell-core = { git = "https://github.com/Lockyc/shell-core", rev = "d6affad4e56ec88c2b056aeb90ef2f7d8a61da74", features = ["runtime"] }
# Unused directly in this crate's code — registration flows through shell_core::register_plugins,
# not this dependency. They exist ONLY so tauri-build's ACL/permission-schema discovery (which walks
# a crate's *direct* dependencies for tauri-plugin-* crates) can see the plugin and let
# capabilities/default.json name its permissions ("updater:default", "process:allow-restart"). A
# plugin registered transitively behind shell-core is invisible to that discovery, and naming its
# permission without a direct dep fails the build outright. Do NOT delete these as dead weight — the
# updater silently loses its capability grant if you do. (geometry carries no such requirement:
# it's a plain in-crate plugin with no JS-facing commands, so it needs no matching direct dep here.)
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
