<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>lector</title>
    <link rel="stylesheet" href="chrome-core.css" />
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body>
    <!-- Hole-punch topology (warden-style): this page IS the window's MAIN webview, spanning the whole
         window, so `data-tauri-drag-region` moves the window natively (a child webview can't). The
         sidebar is a fixed-width column; the content area is a "hole" the Rust-positioned content
         webviews cover (they're add_child siblings composited ABOVE this webview). When no tab covers
         it, the opaque #empty-state shows through. -->
    <div id="app">
      <!-- chrome-core mounts here (adds .cc-root + banner/rows/resize), including its own
           `#cc-titlebar` strip (the `appName` mount config) over the traffic-light zone; the
           sidebar BODY drag is stamped by chrome-core per the windowDrag DTO flag. -->
      <aside id="sidebar" data-tauri-drag-region></aside>
      <div id="content-hole" data-tauri-drag-region>
        <!-- Muted lector mark (open book — lector renders local documentation) — shown by the
             controller when no tab is selected. Composited BEHIND the content webviews (a live tab
             occludes it). Opaque. This is a placeholder pending real brand art (see docs/FOLLOWUPS).
             Deliberately NOT curator's tabs-and-page mark, which lector was scaffolded from. -->
        <div id="empty-state">
          <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="no tab selected">
            <rect x="0" y="0" width="1024" height="1024" rx="224" fill="#333333" />
            <!-- Two facing pages of an open book. -->
            <g fill="#555555">
              <rect x="176" y="312" width="312" height="400" rx="28" />
              <rect x="536" y="312" width="312" height="400" rx="28" />
            </g>
            <!-- Center spine. -->
            <rect x="496" y="300" width="32" height="424" rx="12" fill="#444444" />
            <!-- Text lines on each page. -->
            <g fill="#444444">
              <rect x="216" y="372" width="232" height="22" rx="11" />
              <rect x="216" y="424" width="232" height="22" rx="11" />
              <rect x="216" y="476" width="232" height="22" rx="11" />
              <rect x="216" y="528" width="232" height="22" rx="11" />
              <rect x="216" y="580" width="180" height="22" rx="11" />
              <rect x="576" y="372" width="232" height="22" rx="11" />
              <rect x="576" y="424" width="232" height="22" rx="11" />
              <rect x="576" y="476" width="232" height="22" rx="11" />
              <rect x="576" y="528" width="232" height="22" rx="11" />
              <rect x="576" y="580" width="180" height="22" rx="11" />
            </g>
          </svg>
        </div>
      </div>
    </div>
    <script src="chrome-core.js"></script>
    <script type="module" src="chrome.js"></script>
  </body>
</html>
